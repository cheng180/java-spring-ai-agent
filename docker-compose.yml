# ============================================
# 汽车销售 AI 客服 — Docker Compose（整栈容器化部署用）
#
# ⚠️ 本地开发不要用这个文件！本地开发走 compose.yml（只起 Chroma，
# 应用用 ./mvnw 跑）。docker compose 裸命令优先选 compose.yml。
# 此文件会额外 build 应用镜像，仅用于整栈容器化部署：
#   docker compose -f docker-compose.yml up -d
# ============================================

services:
  # ---- ChromaDB 向量数据库 ----
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # ---- Spring Boot AI 客服应用 ----
  app:
    build: .
    container_name: ai-car-sales
    ports:
      - "8080:8080"
    environment:
      # 千问 Chat (DashScope) — 从 .env 或宿主环境读取，切勿写入明文密钥
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # 硅基流动 Embedding
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      # DeepSeek（备用）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # Anthropic Claude（备用）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-your-anthropic-api-key}
    volumes:
      - app_data:/app/data
    depends_on:
      - chromadb
    restart: unless-stopped

volumes:
  chroma_data:
  app_data:
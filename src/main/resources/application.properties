spring.application.name=AI

# ⚠️ test 分支（本地测试）配置：
#    Chat 模型 = DeepSeek（环境变量 DEEPSEEK_API_KEY）
#    Chroma = 本地 docker（127.0.0.1:8001，先执行 docker compose up -d）
#    正式分支（main/new）指向线上：qwen-max + 内网 Chroma

# ========== 数据库配置（SQLite 本地文件） ==========
spring.datasource.url=jdbc:sqlite:company_inventory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ========== Spring AI 通用配置 ==========
spring.ai.model.chat=deepseek

# ========== Chat 模型：DeepSeek（本地测试分支） ==========
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.model=deepseek-chat

# ========== OpenAI starter：仅 Embedding（指向硅基流动 SiliconFlow） ==========
# Chat 走 DeepSeek（spring.ai.model.chat=deepseek），此处只用于 BGE-M3 embedding
spring.ai.openai.api-key=${SILICONFLOW_API_KEY}
spring.ai.openai.base-url=https://api.siliconflow.cn/v1
spring.ai.openai.chat.model=gpt-4o
spring.ai.openai.embedding.options.model=BAAI/bge-m3

# ========== Chroma 向量库（RAG 知识库） ==========
# 注意：必须用 127.0.0.1 而不是 localhost——Java 会优先解析到 IPv6 ::1，
# 而 Docker 端口映射只监听 IPv4，会导致 Connection reset
spring.ai.vectorstore.chroma.client.host=http://127.0.0.1
spring.ai.vectorstore.chroma.client.port=8001
spring.ai.vectorstore.chroma.collection-name=car-sales-kb
spring.ai.vectorstore.chroma.initialize-schema=true

# ========== 检索相似度阈值（#37 外置；标定工具见 #40，改这里即生效） ==========
# 阶段一父块召回门槛：高于此值才认定"命中车系"，否则走回退泛检索。
# 调低→更多查询被当作车系问题（召回升、可能误拉车系）；调高→更多查询走泛检索。
retrieval.threshold.series-confidence=0.6
# 回退路径注入下限：子块/百科/话术相似度低于此值不注入，防硬答幻觉。
retrieval.threshold.rag-fallback=0.5

# ========== 模糊程度打分（#41 外置；三层证据见 #35 决策 1/2，标定工具见 #40） ==========
# 0/1 档边界：清晰判定的置信阈值（第三个相似度阈值；序约束 0.7≥0.6≥0.5 由 VagueScorer 强制）
vague.confidence.clear=0.7
# 相对领先度：top1-top2 差距 ≥ 此值 = 明确领先（高置信，抗分数整体漂移）
vague.lead.clear-gap=0.15
# 相对领先度：top1-top2 差距 ≤ 此值 = 候选"咬得近"（浅模糊，给 top 1-2 选项确认）
vague.lead.close-gap=0.05
# 2/3 档边界复用 retrieval.threshold.rag-fallback；灰色地带上沿复用 series-confidence

# ========== Anthropic (Claude) 配置 ==========
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:your-anthropic-api-key}
spring.ai.anthropic.chat.model=claude-sonnet-4-5

# ========== positionstack 地理编码（#16：城市→坐标兜底） ==========
# 真实 key 走环境变量 POSITIONSTACK_API_KEY，不进仓库（仓库 public）。
# 未配置时 locateByCity 降级返回 null，门店查询回退到"未找到该城市的门店"。
positionstack.api-key=${POSITIONSTACK_API_KEY:}
# 免费档历史上只支持 http（非 https），实现时如有 TLS 问题可在此调整
positionstack.base-url=http://api.positionstack.com/v1/forward

# ========== 公司信息配置 ==========
company.name=卖好车汽车销售有限公司
company.phone=400-888-9999
company.email=support@maihaoche.com
company.website=https://www.maihaoche.com

# ========== Docker Compose（chromadb 已手动管理，禁掉自动启停） ==========
spring.docker.compose.enabled=false

# ========== Langfuse 可观测（OTLP 追踪智能客服 Agent） ==========
# 链路：Spring AI Observation → micrometer-tracing OTel 桥接 → OTLP HTTP → Langfuse。
# 松耦合：Langfuse 未启动（docker compose 未起）时应用照常运行——导出在后台异步失败、
#         只丢弃 span，不阻塞对话；langfuse.enabled=false 则完全不装配导出器。
# docker compose 启动 Langfuse 后：
#   1) 页面（默认 http://127.0.0.1:3000）创建项目，拿到 pk-lf-... / sk-lf-...
#   2) 用环境变量 LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY 注入（推荐），或直接改下面两行
langfuse.enabled=true
langfuse.endpoint=${LANGFUSE_BASE_URL:http://127.0.0.1:3000}
langfuse.public-key=${LANGFUSE_PUBLIC_KEY:pk-lf-not-set}
langfuse.secret-key=${LANGFUSE_SECRET_KEY:sk-lf-not-set}
# 全量采样：Boot 默认 0.1 会丢 90% 对话，排查期必须 1.0
management.tracing.sampling.probability=1.0
# 把提示词/回复内容写进 span（默认 false 只记录模型与耗时，Langfuse 里看不到对话内容）
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true

# ========== 日志 ==========
logging.level.org.example.ai=DEBUG
logging.level.org.springframework.ai=DEBUG

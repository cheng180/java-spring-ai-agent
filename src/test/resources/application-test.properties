# Test profile — use in-memory SQLite, disable external services
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable Chroma vector store (requires Docker)
spring.ai.vectorstore.chroma.initialize-schema=false

# Prevent KnowledgeBaseInitializer and CarSkuVectorIndexer from trying Chroma
logging.level.org.example.ai=DEBUG

# Disable docker compose
spring.docker.compose.enabled=false
spring.docker.compose.skip.in-tests=true

# Disable AI auto-config that needs external APIs
spring.autoconfigure.exclude=\
org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration,\
org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,\
org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration,\
org.springframework.ai.autoconfigure.deepseek.DeepSeekAutoConfiguration

# Prevent CommandLineRunners that touch Chroma from running
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=9999